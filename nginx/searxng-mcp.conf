# Locations for an HTTPS server block of your host nginx (path-based layout:
# SearXNG at https://<domain>/searxng, MCP endpoint at https://<domain>/mcp).
#
#   sudo mkdir -p /etc/nginx/searxng-mcp
#   sudo cp nginx/searxng-mcp.conf /etc/nginx/searxng-mcp/locations.conf
#   # in the HTTPS server block of your domain, before "location /", add:
#   #     include /etc/nginx/searxng-mcp/locations.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust the proxy_pass ports below to SEARXNG_PORT / MCP_PORT from your .env.
# The vhost must already serve TLS with a valid certificate (certbot or otherwise).

# SearXNG UI + JSON API:  https://<domain>/searxng
# The /searxng prefix is forwarded unchanged and stripped inside SearXNG
# (X-Script-Name, flaskfix.py). Keep it in sync with SEARXNG_BASE_URL.
location /searxng {
    proxy_pass http://127.0.0.1:8080;     # SEARXNG_PORT

    # Overwrite (not append) X-Forwarded-For so clients can't spoof their IP;
    # these headers feed the limiter's IP extraction (limiter.toml).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Script-Name     /searxng;
    proxy_set_header Connection        "";

    proxy_buffering off;
}

# mcp-searxng endpoint:  https://<domain>/mcp
# Exact match - the path already equals the backend's own /mcp endpoint.
location = /mcp {
    proxy_pass http://127.0.0.1:3000;     # MCP_PORT

    # $host has no port → must equal MCP_DOMAIN (MCP_HTTP_ALLOWED_HOSTS)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # SSE responses: no buffering, long-lived connections
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      900s;
    proxy_send_timeout      900s;
}
