# Host nginx server blocks for SearXNG + mcp-searxng.
# Drop into /etc/nginx/sites-available/ (or conf.d/), then adjust:
#   - server_name to SEARXNG_DOMAIN / MCP_DOMAIN from .env
#   - proxy_pass ports to SEARXNG_PORT / MCP_PORT from .env
#   - certificate paths (certbot --nginx can also insert these for you)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ------------------------------------------------------------- SearXNG UI
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx < 1.25.1: use "listen 443 ssl http2;" instead
    server_name search.example.com;

    ssl_certificate     /etc/letsencrypt/live/search.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/search.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "no-referrer"      always;

    location / {
        proxy_pass http://127.0.0.1:8080;     # SEARXNG_PORT
        proxy_http_version 1.1;

        # SearXNG's limiter identifies clients by these; overwrite, don't append,
        # so clients can't spoof their IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme          $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------- mcp-searxng (MCP)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff"          always;

    client_max_body_size 1m;

    # Streamable HTTP endpoint (POST; GET/DELETE for legacy sessions)
    location = /mcp {
        proxy_pass http://127.0.0.1:3000;     # MCP_PORT
        proxy_http_version 1.1;

        # $host has no port → must equal MCP_DOMAIN (MCP_HTTP_ALLOWED_HOSTS)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE streams: no buffering, long-lived connections
        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        proxy_read_timeout  900s;
        proxy_send_timeout  900s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;     # MCP_PORT
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}

# HTTP → HTTPS for both names (skip if certbot already added its own redirect)
server {
    listen 80;
    listen [::]:80;
    server_name search.example.com mcp.example.com;
    return 301 https://$host$request_uri;
}
